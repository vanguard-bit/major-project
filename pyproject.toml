[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adversarial-integration-tester"
version = "0.1.0"
description = "CLI-first prototype for detecting hidden data access in SaaS integrations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "httpx>=0.28.0,<1.0.0",
  "pydantic>=2.9.0,<3.0.0",
  "typer>=0.12.0,<1.0.0",
  "uvicorn>=0.34.0,<1.0.0",
]

[project.scripts]
ait = "ait.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "anyio>=4.8,<5",
]

[tool.setuptools.packages.find]
include = ["ait*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
anyio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Typer requires Argument/Option defaults in function signatures.
"ait/cli.py" = ["B008"]
