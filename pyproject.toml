[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adversarial-integration-tester"
version = "0.1.0"
description = "CLI-first prototype for detecting hidden data access in SaaS integrations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "httpx>=0.28.0,<1.0.0",
  "pydantic>=2.9.0,<3.0.0",
  "typer>=0.12.0,<1.0.0",
  "uvicorn>=0.34.0,<1.0.0",
  "sqlalchemy>=2.0.0,<3.0.0",
  "scikit-learn>=1.3.0,<2.0.0",
  "reportlab>=4.0.0,<5.0.0",
]

[project.scripts]
ait = "ait.cli:app"

[tool.setuptools.packages.find]
include = ["ait*"]
