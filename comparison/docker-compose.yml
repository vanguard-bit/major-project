# Comparison target for RESTler / EvoMaster / AIT.
#
# Full offline RESTler/EvoMaster toolchain images are heavy; this compose file
# only hosts the shared OpenAPI target. Pin digests before claimed runs.
# Prefer a locally prebuilt image with fastapi+uvicorn baked in — runtime
# package installs are intentionally absent (see Dockerfile.comparison-target).
#
# Build once:
#   docker build -t ait-comparison-target:local \
#     -f comparison/Dockerfile.comparison-target comparison/
#
# Network: dedicated bridge so the target is not on the default compose
# network shared with unrelated stacks. Host port 8080 remains published for
# local clients and --network host tool containers. A fully `internal: true`
# network would block that host publish path, so isolation here is
# image-level (no runtime apt/pip) rather than denying host ingress.

services:
  comparison-target:
    image: ait-comparison-target:local
    working_dir: /app
    volumes:
      - ./:/app:ro
    command:
      - python
      - -m
      - uvicorn
      - target_app:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    ports:
      - "8080:8080"
    networks:
      - comparison_net
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 3s
      timeout: 3s
      retries: 20

networks:
  comparison_net:
    driver: bridge
    name: ait_comparison_net
