services:
  comparison-target:
    image: python:3.12-slim@sha256:DIGEST_PLACEHOLDER_PIN_BEFORE_RUN
    working_dir: /app
    volumes:
      - ./:/app:ro
    command:
      - python
      - -c
      - |
        import subprocess, sys
        subprocess.check_call([sys.executable, "-m", "pip", "install", "--quiet", "fastapi==0.115.6", "uvicorn==0.34.0"])
        subprocess.check_call([sys.executable, "-m", "uvicorn", "target_app:app", "--host", "0.0.0.0", "--port", "8080"])
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 3s
      timeout: 3s
      retries: 20

networks:
  default:
    driver: bridge
