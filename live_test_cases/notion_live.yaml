target:
  name: "Notion Live Sandbox"
  base_url: "https://api.notion.com"
  integration_sync_url: "https://api.notion.com"
  audit_base_url: "https://api.notion.com"
  auth_type: "static_token"
  token_config:
    token: "unused-live-runner-reads-env"
  expected_endpoints:
    - "/v1/users/me"
    - "/v1/search"
  expected_scopes:
    - "read content"
  sensitive_markers:
    - "email"
    - "phone_number"
    - "token"
auth_env_var: "NOTION_TOKEN"
auth_scheme: "Bearer"
timeout_seconds: 20
paper:
  platform: "Notion"
  scenario_label: "Notion live read-path validation"
requests:
  - name: "Identity check"
    phase: "baseline"
    method: "GET"
    path: "/v1/users/me"
    expected_behavior: "allowed"
    expected_http: [200]
    headers:
      Notion-Version: "2022-06-28"
      Content-Type: "application/json"
  - name: "Identity check repeated"
    phase: "mutated"
    method: "GET"
    path: "/v1/users/me"
    expected_behavior: "allowed"
    expected_http: [200]
    headers:
      Notion-Version: "2022-06-28"
      Content-Type: "application/json"
  - name: "Search workspace"
    phase: "baseline"
    method: "POST"
    path: "/v1/search"
    expected_behavior: "allowed"
    expected_http: [200]
    headers:
      Notion-Version: "2022-06-28"
      Content-Type: "application/json"
    json_body:
      page_size: 5
  - name: "Repeat search under mutated phase"
    phase: "mutated"
    method: "POST"
    path: "/v1/search"
    expected_behavior: "allowed"
    expected_http: [200]
    headers:
      Notion-Version: "2022-06-28"
      Content-Type: "application/json"
    json_body:
      page_size: 5
