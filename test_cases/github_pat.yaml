name: "GitHub PAT"
platform: "GitHub"
base_url: "http://127.0.0.1:8001"
integration_sync_url: "http://127.0.0.1:8000/sync/github"
audit_base_url: "http://127.0.0.1:8001/"
auth_type: "static_token"
token_config:
  token: "demo-static-access-token"
expected_endpoints:
  - "/github/user/public_repos"
expected_scopes:
  - "public_repo"
sensitive_markers:
  - "repo_secret"
  - "private_key"
paper:
  scenario_label: "PAT broad scope"
  expected_result: "violation"
  expected_categories:
    - "hidden_endpoint"
    - "sensitive_field_access"
  attack_paths:
    - "/github/user/private_repos"
