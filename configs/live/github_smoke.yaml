schema_version: "1.0.0"
id: github-smoke
provider: github
environment: sandbox
base_url: https://api.github.com
allowed_hosts:
  - api.github.com
token_env: AIT_GITHUB_TOKEN
expected_endpoints:
  - /user
sensitive_markers: []
requests:
  - method: GET
    path: /user
    phase: baseline
  - method: GET
    path: /user/repos?per_page=1&page=1
    phase: baseline
  - method: GET
    path: /user/repos?per_page=1&page=2
    phase: baseline
  - method: GET
    path: /user/orgs?per_page=1
    phase: baseline
