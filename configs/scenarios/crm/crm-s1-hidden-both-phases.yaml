schema_version: "1.0.0"
id: crm-s1-hidden-both-phases
suite: crm
platform_style: generic-crm
description: >
  Hidden endpoint positive only. The undeclared billing path appears in both
  baseline and mutated phases so behavioral divergence stays false.
target:
  name: crm-s1-hidden-both-phases
  base_url: http://mock.invalid/
  integration_sync_url: http://integration.invalid/sync
  audit_base_url: http://mock.invalid/
  expected_endpoints:
    - /api/v1/customers
  sensitive_markers:
    - billing_email
    - tax_id
exchanges:
  - phase: baseline
    method: GET
    path: /api/v1/customers
    response_body:
      - customer_id: cust-001
  - phase: baseline
    method: GET
    path: /api/v1/customers/cust-001/billing
    response_body:
      plan: enterprise
  - phase: mutated
    method: GET
    path: /api/v1/customers
    response_body:
      - customer_id: cust-001
  - phase: mutated
    method: GET
    path: /api/v1/customers/cust-001/billing
    response_body:
      plan: enterprise
expected_labels:
  - category: hidden_endpoint
    endpoint: /api/v1/customers/cust-001/billing
