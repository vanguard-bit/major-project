schema_version: "1.0.0"
id: crm-c2-benign-extra-response-field
suite: crm
platform_style: generic-crm
description: >
  Control with an unlisted but non-sensitive response field. No finding should
  be raised for benign extras outside the sensitive marker set.
target:
  name: crm-c2-benign-extra-response-field
  base_url: http://mock.invalid/
  integration_sync_url: http://integration.invalid/sync
  audit_base_url: http://mock.invalid/
  expected_endpoints:
    - /api/v1/customers
  sensitive_markers:
    - billing_email
    - tax_id
exchanges:
  - phase: baseline
    method: GET
    path: /api/v1/customers
    response_body:
      - customer_id: cust-001
        nickname: aster
  - phase: mutated
    method: GET
    path: /api/v1/customers
    response_body:
      - customer_id: cust-001
        nickname: aster
        locale: en-US
expected_labels: []
