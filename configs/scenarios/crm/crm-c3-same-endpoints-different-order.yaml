schema_version: "1.0.0"
id: crm-c3-same-endpoints-different-order
suite: crm
platform_style: generic-crm
description: >
  Control where endpoint order differs between phases but the endpoint sets
  match, so behavioral divergence stays false.
target:
  name: crm-c3-same-endpoints-different-order
  base_url: http://mock.invalid/
  integration_sync_url: http://integration.invalid/sync
  audit_base_url: http://mock.invalid/
  expected_endpoints:
    - /api/v1/customers
    - /api/v1/customers/cust-001
  sensitive_markers:
    - billing_email
    - tax_id
exchanges:
  - phase: baseline
    method: GET
    path: /api/v1/customers
    response_body:
      - customer_id: cust-001
  - phase: baseline
    method: GET
    path: /api/v1/customers/cust-001
    response_body:
      customer_id: cust-001
      name: Aster Labs
  - phase: mutated
    method: GET
    path: /api/v1/customers/cust-001
    response_body:
      customer_id: cust-001
      name: Aster Labs
  - phase: mutated
    method: GET
    path: /api/v1/customers
    response_body:
      - customer_id: cust-001
expected_labels: []
