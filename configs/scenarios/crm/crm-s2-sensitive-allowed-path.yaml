schema_version: "1.0.0"
id: crm-s2-sensitive-allowed-path
suite: crm
platform_style: generic-crm
description: >
  Sensitive-field positive only on an allowlisted endpoint. Every observed
  path is declared expected so hidden-endpoint and divergence stay false.
target:
  name: crm-s2-sensitive-allowed-path
  base_url: http://mock.invalid/
  integration_sync_url: http://integration.invalid/sync
  audit_base_url: http://mock.invalid/
  expected_endpoints:
    - /api/v1/customers
    - /api/v1/customers/cust-001/billing
  sensitive_markers:
    - billing_email
    - tax_id
exchanges:
  - phase: baseline
    method: GET
    path: /api/v1/customers
    response_body:
      - customer_id: cust-001
  - phase: baseline
    method: GET
    path: /api/v1/customers/cust-001/billing
    response_body:
      plan: enterprise
  - phase: mutated
    method: GET
    path: /api/v1/customers
    response_body:
      - customer_id: cust-001
  - phase: mutated
    method: GET
    path: /api/v1/customers/cust-001/billing
    response_body:
      billing_email: run-marker@example.test
      tax_id: TAX-RUN-MARKER
      plan: enterprise
expected_labels:
  - category: sensitive_field_access
    endpoint: /api/v1/customers/cust-001/billing
